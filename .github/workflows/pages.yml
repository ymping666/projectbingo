name: Verify and deploy Bingo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLIC_BASE_PATH: /projectbingo/
      PUBLIC_SITE_URL: https://ymping666.github.io
      PUBLIC_DEPLOYMENT: preview
      INDEXABLE_BUILD: 'false'
      PUBLIC_GA4_ID: ''
      PUBLIC_GA4_MANUAL_ONLY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:preview
      - run: npm run qa:html:preview
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-preview
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static output
        id: deployment
        uses: actions/deploy-pages@v4
